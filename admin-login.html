<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Portal Login | DriveEase Fleet Administration</title>
  
  <meta name="description" content="Secure administrative access for DriveEase fleet management and reservation operations." />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <style>
    body.admin-login-body {
      background: radial-gradient(circle at 10% 20%, #090e17 0%, #0f172a 90%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .admin-login-card {
      background-color: #ffffff;
      border-radius: 20px;
      overflow: hidden;
      max-width: 460px;
      width: 100%;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .admin-login-header {
      background: linear-gradient(135deg, #090e17, #1e293b);
      color: #ffffff;
      padding: 2.5rem 2rem 2rem 2rem;
      text-align: center;
      border-bottom: 2px solid var(--accent-lime);
    }
    .admin-shield-icon {
      width: 60px;
      height: 60px;
      border-radius: 16px;
      background: linear-gradient(135deg, #10e575, #05cd63);
      color: #090e17;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.85rem;
      margin: 0 auto 1rem auto;
      box-shadow: 0 8px 20px rgba(16, 229, 117, 0.35);
    }
  </style>
</head>
<body class="admin-login-body">

  <div class="admin-login-card">
    <!-- Header -->
    <div class="admin-login-header">
      <div class="admin-shield-icon">
        <i class="bi bi-shield-lock-fill"></i>
      </div>
      <h2 class="fw-bold mb-1 text-white">DriveEase Admin</h2>
      <p class="text-white-50 small mb-0">Authorized Fleet &amp; Operations Portal</p>
    </div>

    <!-- Form Body -->
    <div class="p-4 p-md-5">
      <form id="adminLoginForm" novalidate>
        <!-- Email -->
        <div class="auth-field-group mb-3">
          <label for="adminEmail" class="auth-label">Administrator Email</label>
          <div class="auth-input-wrapper">
            <i class="bi bi-person-badge field-icon"></i>
            <input 
              type="email" 
              id="adminEmail" 
              class="auth-input-control" 
              placeholder="admin@driveease.com" 
              value="admin@driveease.com" 
              required 
            />
          </div>
          <div class="auth-error-feedback" id="adminEmailError"></div>
        </div>

        <!-- Password -->
        <div class="auth-field-group mb-4">
          <label for="adminPassword" class="auth-label">Admin Security Key / Password</label>
          <div class="auth-input-wrapper">
            <i class="bi bi-key-fill field-icon"></i>
            <input 
              type="password" 
              id="adminPassword" 
              class="auth-input-control" 
              placeholder="Enter admin password" 
              value="admin123" 
              required 
            />
            <button type="button" class="btn-toggle-password" data-target="adminPassword" aria-label="Toggle password view">
              <i class="bi bi-eye"></i>
            </button>
          </div>
          <div class="auth-error-feedback" id="adminPasswordError"></div>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn-drive-lime w-100 py-3 fw-bold" id="btnAdminLogin">
          <i class="bi bi-box-arrow-in-right me-1"></i> Authenticate to Dashboard
        </button>
      </form>

      <!-- Demo Credentials Hint Box -->
      <div class="demo-hint-box mt-4">
        <i class="bi bi-info-circle-fill"></i>
        <div>
          <strong>Pre-configured Admin Access:</strong><br />
          Email: <code>admin@driveease.com</code><br />
          Password: <code>admin123</code>
        </div>
      </div>

      <div class="text-center mt-4 pt-2 border-top">
        <a href="index.html" class="text-decoration-none small text-muted fw-semibold">
          <i class="bi bi-arrow-left me-1"></i> Return to Customer Marketplace
        </a>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Toggle password
      const toggleBtn = document.querySelector(".btn-toggle-password");
      if (toggleBtn) {
        toggleBtn.addEventListener("click", () => {
          const input = document.getElementById("adminPassword");
          const icon = toggleBtn.querySelector("i");
          if (input.type === "password") {
            input.type = "text";
            icon.classList.replace("bi-eye", "bi-eye-slash");
          } else {
            input.type = "password";
            icon.classList.replace("bi-eye-slash", "bi-eye");
          }
        });
      }

      // Handle Admin Login
      const form = document.getElementById("adminLoginForm");
      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const email = document.getElementById("adminEmail").value.trim();
        const password = document.getElementById("adminPassword").value.trim();
        const emailErr = document.getElementById("adminEmailError");
        const passErr = document.getElementById("adminPasswordError");

        emailErr.classList.remove("visible");
        passErr.classList.remove("visible");

        if (!email) {
          emailErr.textContent = "Admin email is required.";
          emailErr.classList.add("visible");
          return;
        }

        if (!password) {
          passErr.textContent = "Password is required.";
          passErr.classList.add("visible");
          return;
        }

        const loginBtn = document.getElementById("btnAdminLogin");
        loginBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Authenticating...';
        loginBtn.disabled = true;

        try {
          // Attempt backend API login first
          const res = await fetch("/api/admin/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password })
          });

          if (res.ok) {
            const data = await res.json();
            localStorage.setItem("driveease_admin_token", data.token);
            localStorage.setItem("driveease_admin_user", JSON.stringify(data.user));
            showToast("Admin authenticated successfully!", "success");
            setTimeout(() => (window.location.href = "admin.html"), 1000);
            return;
          }
        } catch (err) {
          // Fallback to client-side verification if server API not active
        }

        // Local credential check
        if (email === "admin@driveease.com" && password === "admin123") {
          localStorage.setItem("driveease_admin_token", "admin_jwt_secret_token_driveease_2026");
          localStorage.setItem("driveease_admin_user", JSON.stringify({
            name: "Chief Fleet Admin",
            email: "admin@driveease.com",
            role: "Super Admin",
            avatar: "AD"
          }));
          showToast("Admin access granted. Welcome to Command Center!", "success");
          setTimeout(() => (window.location.href = "admin.html"), 1000);
        } else {
          loginBtn.innerHTML = '<i class="bi bi-box-arrow-in-right me-1"></i> Authenticate to Dashboard';
          loginBtn.disabled = false;
          passErr.textContent = "Invalid administrator credentials. Please check details.";
          passErr.classList.add("visible");
          showToast("Access Denied: Invalid credentials.", "error");
        }
      });
    });
  </script>
</body>
</html>
